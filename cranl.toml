# CranL deploy notes (committed, no secrets)
# Docs: https://docs.cranl.com/ · repo docs/cranl-deploy.md
# CLI: cranl login <api-key> && cranl projects select <id>
#
# Platform probes (set in CranL UI if available):
#   liveness  = GET /api/health/live
#   readiness = GET /api/health/ready
#   alias     = GET /api/health  (same as live)
# Dockerfile also defines HEALTHCHECK → /api/health/live
# Downtime playbook: docs/cranl-deploy.md § Probes & graceful restart
# Always set STORAGE_BACKEND=cloud on CranL (ephemeral disk).

name = "arabicbuzz"
build_type = "dockerfile"
branch = "main"
# Prefer germany/us-east on Basic; MENA (riyadh/jeddah/egypt) needs Pro+
region = "germany"
port = 3000
# Dockerfile defaults INSTALL_LIBREOFFICE=1 (free Word↔PDF). If a deploy fails
# on image size/timeout, rebuild with --build-arg INSTALL_LIBREOFFICE=0 and rely
# on Google Drive convert (free with linked OAuth).
