[build]
  command = "npm run build"
  # Required so publish != site base; Next.js Runtime still owns the final output.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Deploy note ─────────────────────────────────────────────────────────────
# Primary production is CranL (Dockerfile / standalone). See docs/cranl-deploy.md.
# This Netlify OpenNext config is retained as a fallback while credits allow.
#
# ── Cron (external scheduler → Next.js API routes) ──────────────────────────
# Netlify OpenNext does not run stdio MCP or in-process cron daemons.
# Production uses GitHub Actions (.github/workflows/cron-runner.yml) every ~15 min.
# After CranL cutover, APP_URL in that workflow must be the *.cranl.net host.
#
#   POST https://<APP_URL>/api/crons/runner
#   Authorization: Bearer $CRON_SECRET
#
# Runner covers: heartbeats · Thursday director digest (Asia/Riyadh) ·
# morning room digest (06–10 Riyadh) · ~1h appointment Telegram reminders ·
# Drive brain sync · room chat retention (ROOM_CHAT_RETENTION_DAYS, default 4)
#
# Or Thursday-only director digest:
#   POST https://arabicbuzz.netlify.app/api/crons/director-digest
#   Authorization: Bearer $CRON_SECRET
#   Body: {}  |  ?force=1 to send any day
#
# Env on Netlify: CRON_SECRET, DIRECTOR_EMAIL, RESEND_API_KEY, RESEND_FROM
# Optional: DIGEST_EMAIL, DIGEST_NAME_AR, TELEGRAM_* for digest channels
# Optional: TELEGRAM_VOICE_REPLY=0|1|auto — short Arabic TTS (default auto)
# Optional: ROOM_CHAT_RETENTION_DAYS=4 (prunes room_posts only; keeps workspace_files)
# Optional search/MCP: BRAVE_API_KEY, BRAVE_MCP_URL, MCP_REMOTE_SERVERS,
#   SUPABASE_MCP_URL, FIRECRAWL_API_KEY (stdio MCPs need Mac bridge / remote URL)
