# Ops heartbeat → CranL Next.js cron API.
# Requires GitHub secret CRON_SECRET (same value as CranL CRON_SECRET).
name: Cron runner

on:
  schedule:
    # Every 15 minutes — aggressive auto-sync (mail · calendar · Drive · Telegram)
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require live Telegram group-push gate (no spam on stale deploys)
        env:
          APP_URL: https://arabicbuzz-fooc9h.cranl.net
        run: |
          set -euo pipefail
          # Until CranL serves telegramGroupPush.masterEnabled=false, do NOT hit
          # /api/crons/runner — old builds still auto-post digests/reminders.
          body=$(curl -sS --max-time 30 "${APP_URL}/api/health/free" || true)
          echo "$body" | head -c 800
          echo
          if ! echo "$body" | grep -q '"telegramGroupPush"'; then
            echo "SKIP: live build lacks telegramGroupPush gate — refusing cron to protect group."
            exit 0
          fi
          if ! echo "$body" | grep -q '"masterEnabled"'; then
            echo "SKIP: telegramGroupPush shape incomplete — refusing cron."
            exit 0
          fi

      - name: POST /api/crons/runner
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://arabicbuzz-fooc9h.cranl.net
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is missing in this repo."
            exit 1
          fi
          # Re-check gate immediately before POST (deploy can lag).
          health=$(curl -sS --max-time 30 "${APP_URL}/api/health/free" || true)
          if ! echo "$health" | grep -q '"masterEnabled"'; then
            echo "SKIP: gate not live — no POST."
            exit 0
          fi
          code=$(curl -sS -o /tmp/cron-body.json -w '%{http_code}' \
            -X POST "${APP_URL}/api/crons/runner" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            -d '{}')
          echo "HTTP ${code}"
          head -c 2000 /tmp/cron-body.json || true
          echo
          test "$code" = "200"
