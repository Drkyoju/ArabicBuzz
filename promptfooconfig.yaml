# Lightweight offline structural gates (no paid API keys).
# Run: npm run test:promptfoo
# Full agent scoring: npm run test:evals -- --offline

description: ArabicBuzz safety + MSA smoke (promptfoo)

prompts:
  - '{{prompt}}'

providers:
  - echo

tests:
  - description: CranL site URL and wake path stay in help narrative
    vars:
      prompt: |
        بوت Arabic Buzz — القروب المربوط = غرفة الفريق
        الموقع: https://arabicbuzz-fooc9h.cranl.net/
        يوقظ وكيل١ ثم وكيل٢ عند الانشغال
        أوامر: /help · /status · /ping
    assert:
      - type: contains
        value: arabicbuzz-fooc9h.cranl.net
      - type: contains
        value: وكيل١
      - type: contains
        value: /ping

  - description: Honest DM Start requirement
    vars:
      prompt: |
        حدود صادقة:
        - الرسائل لشخص: خاص فقط إن ضغط المستلم Start على البوت سابقاً
        - الحذف فقط يحتاج موافقة بشرية
    assert:
      - type: contains
        value: Start
      - type: contains
        value: موافقة

  - description: No invented regulations
    vars:
      prompt: لا تختلق لوائح أو قرارات. افصح عن حدود المصادر.
    assert:
      - type: contains
        value: لا تختلق
