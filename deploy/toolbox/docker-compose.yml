# Local / VPS: Google MCP Toolbox → Streamable HTTP at http://localhost:5000/mcp
#
# Usage:
#   cp .env.example .env   # fill POSTGRES_* (or run ./scripts/env-from-database-url.sh)
#   docker compose up -d
#   curl -sS http://127.0.0.1:5000/mcp   # expect MCP transport (not 404)
#
# Then set Netlify: MCP_TOOLBOX_URL=https://<public-host>/mcp

services:
  toolbox:
    image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.8.0
    platform: linux/amd64
    ports:
      - "${TOOLBOX_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Prefer sslmode=require for Supabase / managed Postgres
      POSTGRES_QUERY_PARAMS: ${POSTGRES_QUERY_PARAMS:-sslmode=require}
    # data toolset = SQL-oriented; full `postgres` also exposes admin/observability tools
    command:
      [
        "--prebuilt",
        "postgres/data",
        "--address",
        "0.0.0.0",
        "--port",
        "5000",
      ]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5000/ || exit 0",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
